<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <form>
        Name : <input type="text" id="name" placeholder="Enter Your Name Here!" />
        <br /><br />
        Email : <input type="text" id="email" placeholder="Enter Your Email Here!" />
        <br /><br />
        Phone : <input type="number" id="phone" placeholder="Enter Your Phone Here!" />
        <br /><br />
        Password : <input type="password" id="password" placeholder="Enter Your Password Here!" />
        <br /><br />
        Confirm Password : <input type="password" id="confpassword" placeholder="Enter Your Confirm Password Here!" />
        <br /><br />
        <input type="button" value="Submit" onclick="ValidateData()" />
    </form>
    <p id="message">
    </p>

    <table>
        <thead>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
        </thead>
        <tbody id="usersData">
        </tbody>


    </table>

    <script>

        function ValidateData() {
            var NAME = document.getElementById("name").value;
            // console.log(NAME);
            var EMAIL = document.getElementById("email").value;
            // console.log(EMAIL);
            var PHONE = document.getElementById("phone").value;
            //console.log(PHONE);
            var PASSWORD = document.getElementById("password");
            var CONFPASSWORD = document.getElementById("confpassword");

            if (NAME == "") {
                document.getElementById("message").innerHTML = "<span style='color:red'>Name cannot be empty</span>";
            }
            else if (EMAIL == "") {
                document.getElementById("message").innerHTML = "<span style='color:red'>Email cannot be empty</span>";
            }
            else if (PHONE == "") {
                document.getElementById("message").innerHTML = "<span style='color:red'>Phone Number cannot be empty</span>";
            }
            else if (PASSWORD.value.length < 6) {
                document.getElementById("message").innerHTML = "<span style='color:red'>Password must be at least 6 characters long</span>";
            }
            // else if (!/[0-9]/.test(PASSWORD.value)) {
            //     document.getElementById("message").innerHTML = "<span style='color:red'>Password must contain at least one digit</span>";
            // }
            // else if (!/[a-z]/.test(PASSWORD.value)) {
            //     document.getElementById("message").innerHTML = "<span style='color:red'>Password must contain at least one small character</span>";
            // }
            // else if (!/[A-Z]/.test(PASSWORD.value)) {
            //     document.getElementById("message").innerHTML = "<span style='color:red'>Password must contain at least one capital character</span>";
            // }
            else if (PASSWORD.value != CONFPASSWORD.value) {
                document.getElementById("message").innerHTML = "<span style='color:red'>Passwords do not match</span>";
            }
            else {
                document.getElementById("message").innerHTML = "<span style='color:green'>Form submitted successfully!</span>";
                DisplayUsers(NAME, EMAIL, PHONE);
            }

        }

        let users = []

        function DisplayUsers(NAME, EMAIL, PHONE) {
            users.push({ name: NAME, email: EMAIL, phone: PHONE })
            console.log(users);

            var row = "";
            for(let i=0; i<users.length; i ++){
                row = row + "<tr><td>"+users[i].name+"</td><td>"+users[i].email+"</td><td>"+users[i].phone+"</td></tr>"
            }
             document.getElementById("usersData").innerHTML = row;

        }



    </script>


    <script>
        // console.log(/[0-9]/.test('abc')); // false //true
        // console.log(/[0-9]/.test('123')); // true
        // console.log(/[0-9]/.test('abc1')); // true
        // console.log(/[A-Z]/.test('abc')); // false
        // console.log(/[A-Z]/.test('ABC')); // true
        // console.log(/[A-Z]/.test('aBC')); // true
        // console.log(/[a-z]/.test('ABC')); // false
    </script>

</body>

</html>
