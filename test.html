  <body>
    <form>
      Name : <input type="text" placeholder="Enter your name"  id="name"/> <br><br>
      Email :
      <input type="email" placeholder="Enter your email" id="email" /><br><br>
      Phone :
      <input type="tel" placeholder="Enter your phone number" id="phone" /><br><br>
      Password :
      <input type="password" placeholder="Enter your password" id="password" /><br><br>
      Confirm Password :
      <input type="password" placeholder="Confirm your password" id="confpassword" /><br><br>
      <input type="button" value="submit" onclick="ValidateForm()"></input>
    </form>

    <div id="message">
    </div>

    <script>
        function ValidateForm(){
            var NAME = document.getElementById("name").value;
            var EMAIL = document.getElementById("email").value;
            var PHONE = document.getElementById("phone").value;
            var PASSWORD = document.getElementById("password").value;
            var CONFPASSWORD = document.getElementById("confpassword").value;

            if(NAME == "")
            document.getElementById("message").innerHTML = "<span style='color:red'>Please enter your Name</span>";
            else if(EMAIL == "")    
            document.getElementById("message").innerHTML = "<span style='color:red'>Please enter your Email</span>";
            else if(PHONE == "")    
            document.getElementById("message").innerHTML = "<span style='color:red'>Please enter your Phone number</span>";
            else if(PASSWORD == "")    
            document.getElementById("message").innerHTML = "<span style='color:red'>Please enter your Password</span>";
            else if (PASSWORD.length < 6)
            document.getElementById("message").innerHTML = "<span style='color:red'>Password must be at least 6 characters long</span>";
            else if (!/[0-9]/.test(PASSWORD))
            document.getElementById("message").innerHTML = "<span style='color:red'>Password must contain at least one number</span>";
            else if (!/[A-Z]/.test(PASSWORD))
            document.getElementById("message").innerHTML = "<span style='color:red'>Password must contain at least one uppercase letter</span>";
            else if (!/[a-z]/.test(PASSWORD))
            document.getElementById("message").innerHTML = "<span style='color:red'>Password must contain at least one lowercase letter</span>";
            else if(CONFPASSWORD == "")    
            document.getElementById("message").innerHTML = "<span style='color:red'>Please confirm your Password</span>";
            else if(PASSWORD != CONFPASSWORD)    
            document.getElementById("message").innerHTML = "<span style='color:red'>Password and Confirm Password do not match</span>";
            else
            document.getElementById("message").innerHTML = "<span style='color:green'>Form submitted successfully!</span>";   

            
        }
